            const weekCourses = {};
            if (courses[currentWeek]) {
                courses[currentWeek].forEach(c => {
                    for (let t = c[1]; t <= c[2]; t++) {
                        weekCourses[`${c[0]}_${t}`] = { name: c[3], type: c[4] || "course" };
                    }
                });
            }

            for (let time = 8; time <= 19; time++) {
                const tr = document.createElement('tr');
                const th = document.createElement('td');
                th.className = 'time-col';
                th.innerHTML = time === 12 ? "12:00<br>午休" : `${time.toString().padStart(2, '0')}:00<br>~<br>${(time+1).toString().padStart(2, '0')}:00`;
                tr.appendChild(th);

                for (let day = 1; day <= 7; day++) {
                    const td = document.createElement('td');
                    td.className = `interactive day-col ${day === currentDay ? 'active-day' : ''}`;
                    const key = `${currentWeek}_${day}_${time}`;
                    
                    if (day <= 5 && weekCourses[`${day}_${time}`]) {
                        const course = weekCourses[`${day}_${time}`];
                        let div = document.createElement('div');
                        div.innerText = course.name;
                        div.className = course.type === 'holiday' ? 'course-block holiday-block' : (course.type === 'exam' ? 'course-block exam-block' : 'course-block');
                        td.appendChild(div);
                    }

                    if (plans[key]) {
                        const plan = plans[key];
                        const duration = plan.duration || 1; 
                        let div = document.createElement('div');
                        let typeIcon = plan.type === 'swim' ? '🏊' : (plan.type === 'bike' ? '🚴' : '🏃');
                        let typeName = plan.type === 'swim' ? '游泳' : (plan.type === 'bike' ? '騎車' : '跑步');
                        let statusText = plan.status === 'confirmed' ? '(已確認)' : `(待確認: ${plan.proposedBy})`;
                        
                        div.className = `training-plan ${plan.type} status-${plan.status}`;
                        div.style.height = `calc(${duration * 100}% + ${Math.floor(duration - 1)}px - 4px)`;
                        div.innerHTML = `<span>${typeIcon} ${typeName} (${duration}h)</span><span style="font-size:0.65rem; margin-top:2px; font-weight:normal;">${statusText}</span>`;
                        td.appendChild(div);
                    }

                    td.onclick = () => handleCellClick(day, time, plans[key]);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function updateStats() {
            let sCount = 0, bCount = 0, rCount = 0;
            let sHour = 0, bHour = 0, rHour = 0;
            for (let key in plans) {
                let dur = plans[key].duration || 1;
                if (plans[key].type === 'swim') { sCount++; sHour += dur; }
                if (plans[key].type === 'bike') { bCount++; bHour += dur; }
                if (plans[key].type === 'run') { rCount++; rHour += dur; }
            }
            document.getElementById('stat-swim').innerText = `🏊 ${sCount}次(${sHour}h)`;
            document.getElementById('stat-bike').innerText = `🚴 ${bCount}次(${bHour}h)`;
            document.getElementById('stat-run').innerText = `🏃 ${rCount}次(${rHour}h)`;
        }

        let currentTargetKey = null;

        function handleCellClick(day, time, existingPlan) {
            const weekInfo = weeksData[currentWeek];
            currentTargetKey = `${currentWeek}_${day}_${time}`;
            const timeStr = `${time.toString().padStart(2, '0')}:00`;
            const modal = document.getElementById('action-modal');
            const btns = document.getElementById('modal-actions');
            const desc = document.getElementById('modal-desc');
            
            if (!existingPlan) {
                document.getElementById('modal-title').innerText = `安排訓練 (${weekInfo.dates[day-1]} ${timeStr})`;
                desc.innerText = "請選擇項目：";
                document.getElementById('duration-container').style.display = 'block'; 
                btns.innerHTML = `<button class="btn btn-swim" onclick="savePlan('swim', 'proposed')">🏊 安排游泳</button><button class="btn btn-bike" onclick="savePlan('bike', 'proposed')">🚴 安排騎車</button><button class="btn btn-run" onclick="savePlan('run', 'proposed')">🏃 安排跑步</button><button class="btn btn-cancel" onclick="closeModal('action-modal')">取消</button>`;
            } else {
                document.getElementById('duration-container').style.display = 'none';
                let dur = existingPlan.duration || 1;
                document.getElementById('modal-title').innerText = `訓練協商 (${timeStr})`;
                
                if (existingPlan.status === 'confirmed') {
                    desc.innerText = `已確認的訓練 (共 ${dur} 小時)。`;
                    btns.innerHTML = `<button class="btn btn-cancel" onclick="deletePlan('${existingPlan.proposedBy}', 'cancel_confirmed')">取消此訓練</button><button class="btn btn-cancel" style="background:#e5e7eb; color:#333;" onclick="closeModal('action-modal')">關閉</button>`;
                } else if (existingPlan.proposedBy === currentUser) {
                    desc.innerText = `等待對方同意中...`;
                    btns.innerHTML = `<button class="btn btn-cancel" onclick="deletePlan('${existingPlan.proposedBy}', 'withdraw')">撤回提議</button><button class="btn btn-cancel" style="background:#e5e7eb; color:#333;" onclick="closeModal('action-modal')">關閉</button>`;
                } else {
                    desc.innerText = `${existingPlan.proposedBy} 提議在這裡訓練 ${dur} 小時。\n你同意嗎？`;
                    btns.innerHTML = `<button class="btn btn-agree" onclick="savePlan('${existingPlan.type}', 'confirmed', '${existingPlan.proposedBy}')">✅ 同意</button><button class="btn btn-disagree" onclick="deletePlan('${existingPlan.proposedBy}', 'reject')">❌ 不同意 (退回重選)</button><button class="btn btn-cancel" onclick="closeModal('action-modal')">關閉</button>`;
                }
            }
            modal.style.display = 'flex';
        }

        function savePlan(type, status, originalProposer = null) {
            let dur = status === 'proposed' ? parseFloat(document.getElementById('plan-duration').value) : plans[currentTargetKey].duration;
            const typeName = type === 'swim' ? '游泳' : (type === 'bike' ? '騎車' : '跑步');
            
            db.ref('triathlon_plans/' + currentTargetKey).set({ type: type, proposedBy: status === 'proposed' ? currentUser : originalProposer, status: status, duration: dur });
            
            if (status === 'confirmed' && originalProposer) {
                sendNotification(originalProposer, `${currentUser} ✅ 同意了你第 ${currentWeek} 週的 ${typeName} 提議！`);
            }
            closeModal('action-modal');
        }

        function deletePlan(targetUser, actionType) {
            const plan = plans[currentTargetKey];
            const typeName = plan.type === 'swim' ? '游泳' : (plan.type === 'bike' ? '騎車' : '跑步');

            if (actionType === 'reject') {
                sendNotification(targetUser, `${currentUser} ❌ 拒絕了你第 ${currentWeek} 週的 ${typeName} 提議。`);
                alert("已拒絕。請在畫面上點擊新時段重新發起提議！");
            } else if (actionType === 'cancel_confirmed' && confirm('確定要取消這個已經排好的訓練嗎？')) {
                sendNotification(targetUser, `${currentUser} 取消了你們原本確認好的 ${typeName} 訓練。`);
            } else if (actionType === 'withdraw' && !confirm('確定要撤回提議嗎？')) {
                return;
            }

            db.ref('triathlon_plans/' + currentTargetKey).remove();
            closeModal('action-modal');
        }

        function sendNotification(targetUser, message) {
            if (targetUser === currentUser || !targetUser) return; 
            db.ref('notifications/' + targetUser).push({ message: message, timestamp: Date.now(), read: false });
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000); 
        }

        function updateNotificationUI() {
            let unreadCount = 0;
            const notiList = document.getElementById('noti-list');
            notiList.innerHTML = '';
            const notiArray = Object.keys(myNotifications).map(k => ({id: k, ...myNotifications[k]}));
            notiArray.sort((a, b) => b.timestamp - a.timestamp);

            if (notiArray.length === 0) {
                notiList.innerHTML = '<p style="color: #9ca3af;">目前沒有任何通知</p>';
            }

            notiArray.forEach(noti => {
                if (!noti.read) unreadCount++;
                let dateStr = new Date(noti.timestamp).toLocaleString('zh-TW', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'});
                notiList.innerHTML += `<div class="notification-item ${noti.read ? '' : 'unread'}"><div>${noti.message}</div><div class="notification-time">${dateStr}</div></div>`;
            });

            const badge = document.getElementById('noti-badge');
            if (unreadCount > 0) {
                badge.innerText = unreadCount > 9 ? '9+' : unreadCount;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }

        function openNotifications() { document.getElementById('noti-modal').style.display = 'flex'; }
        function closeNotifications() {
            document.getElementById('noti-modal').style.display = 'none';
            for (let key in myNotifications) {
                if (!myNotifications[key].read) db.ref(`notifications/${currentUser}/${key}`).update({ read: true });
            }
        }
        function switchUser() {
            let newUser = prompt("請輸入您的名字：", currentUser);
            if (newUser) { currentUser = newUser; localStorage.setItem('triathlon_user', currentUser); window.location.reload(); }
        }
        function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

        init();
    </script>
</body>
</html>
